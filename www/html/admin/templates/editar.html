<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8"/>
	<title>Editar</title>
	<script type="text/javascript" src="js/modificarEstiloInputFile.js"></script>
    <script type="text/javascript" src="js/jquery-1.7.2.min.js"></script>
	<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
	<h1>Editar Usuario: {$usuario.usuario}</h1>
		<div id="imagen">
			<form id="margen" action="editar.php" method="post">
				<label for="usuario">Usuario</label><br>
				<input type="hidden" id="id" name="id" value="{$usuario.id}"/>
				<input type="text" name="usuario" class="inputImagen" id="archivo1" value='{$usuario.usuario}' readonly>No se puede cambiar<br><br>
				<label for="nombre">Nombre</label><br>
				<input type="text" name="nombre" class="inputImagen" value="{$usuario.nombre}"><br><br>
				<label for="apellido">Apellido</label><br>
				<input type="text" name="apellido" class="inputImagen" value="{$usuario.apellido}"><br><br>
				<label for="usuario">Tipo de acceso actual: </label>
				{if $usuario.tipo eq "a"}
				Administrador
				{elseif $usuario.tipo eq "b"}
				Cotizador
				{else}
				Usados
				{/if}
				<div>
					
					<select type="text" name="acceso" class="inputImagen" id="archivo1"><br>
						<option value="a">Administrador</option>
						<option value="b">Cotizador</option>
						<option value="c">Usados</option>
				
					</select>
				</div><br><br>
				<label for="usuario">Visualización de Precios actual:</label>
				{if $usuario.ver eq "s"}
				Si
				{else}
				No
				{/if}
				<div>
					
					<select type="text" name="precio" class="inputImagen"  id="archivo1"><br>
						<option value="{$usuario.ver}"></option>
						<option value="s">Si</option>
						<option value="n">No</option>
				
				
					</select>
				</div><br><br>
				<label for="pass">Pass</label><br>
				<input type="hidden" name="passantigua" id="passantigua" value="{$usuario.pass}"/>
				<input type="password" name="pass" class="inputImagen" id="archivo1"><br><br><br>
				<label for="pass">Codigo personal</label><br>
				<input type="text" name="codant" id="passantigua" class="inputImagen" value="{$usuario.cod}" />
				<br><br>
				<input type="submit" value="Guardar" class="botonInputFileModificado1"/>
				<a class="botonInputFileModificado1" href="index.php">Cancelar</a>
			</form>

			<!--<form action="salir.php" method="post">
				<input type="submit" value="Salir" class="botonInputFileModificado1"/>
			</form>-->
		</div>
</body>
</html>
