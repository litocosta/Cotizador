<div>
<form type="post">
    <label for="nombre">Nombre</label>
    <input type="text" name="nombre" id="nombre" pattern="([A-Za-z\u00f1\u00d1\u00E0-\u00FC]{1,24}[\s]*)+" required/>
    
    <input type="text" name="patente" id="patente" pattern="([A-Za-z]{3}[0-9]{3})*([A-Za-z]{2}[0-9]{3}[A-Za-z]{2})*" required/>
    <input type="submit" value ="entrar"/>
</form>
</div>
