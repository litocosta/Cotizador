<style>
	/*Botón*/
.drop-button{
  background-color:  #ffffff;
  color: rgb(5, 5, 5);
  padding: 15px;
  border-radius: 5px;
  font-size: 16px;
  border: none;
  cursor: pointer;
}

/*Botón hover y focus*/
.drop-button:hover, drop-buttton:hover{
  background-color: #f0f0f0;
}

/*Posición del contenedor*/
.dropdown{
  position: relative;
  display: inline-block;
 }

/*submenu*/
.dropdown-content{
  background-color: #ffffff;
  display: none;
  margin-left: 15%;
  position: absolute;
  align-items: center;
  min-width: 100px;
  box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.9);
  z-index: 1;
}

.dropdown-content a{
  color: #000000;
  padding: 12px 16px;
  display: block;
}

.dropdown-content a:hover{
  background-color: #f1f1f1
}
.show {
  display: block;
}



</style>
<script>
	/*Cuando se hace click en el botón, muestra el submenu*/
		function myFunction() {
			//Añade una clase al elemento que tenga el id myDropdown
			document.getElementById("myDropdown").classList.toggle("show");
		}

		//Cierra el submenu si se clica fuera
		window.onclick = function (event) {
			if (!event.target.matches('.drop-button')) {
				var dropdowns = document.getElementsByClassName("dropdown-content");
				var i;
				for (i = 0; i < dropdowns.length; i++) {
					var openDropdown = dropdowns[i];
					//Busca dentro de drop-content los elementos con la clase show
					if (openDropdown.classList.contains('show')) {
						//elimina la clase show de los elementos dentro de drop-content
						openDropdown.classList.remove('show');
					}
				}
			}
		}
</script>
